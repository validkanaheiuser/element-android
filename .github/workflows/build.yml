name: APK Build

on:
  pull_request: { }
  push:
    branches: [ main, develop ]
  workflow_dispatch: { }

permissions: {}

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5120m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon

jobs:
  debug:
    name: Build debug APKs (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [ Gplay, Fdroid ]
    # Allow all jobs on develop. Just one per PR.
    concurrency:
      group: ${{ github.ref == 'refs/heads/develop' && format('integration-tests-develop-{0}-{1}', matrix.target, github.sha) || format('build-debug-{0}-{1}', matrix.target, github.ref)  }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # https://github.com/actions/checkout/issues/881
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble ${{ matrix.target }} debug apk
        run: ./gradlew assemble${{ matrix.target }}Debug $CI_GRADLE_ARG_PROPERTIES

  release:
    name: Build unsigned GPlay APKs
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref == 'refs/head/main' && format('build-release-apk-main-{0}', github.sha) || github.ref == 'refs/heads/develop' && format('build-release-apk-develop-{0}', github.sha) || format('build-debug-{0}', github.ref)  }}
      cancel-in-progress: ${{ github.ref != 'refs/head/main' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # https://github.com/actions/checkout/issues/881
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble GPlay unsigned apk
        run: ./gradlew clean assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES
      # The release signing key MUST be stable across runs. Android refuses to install an update signed with a
      # different certificate, so a key generated per build forces every user to uninstall the app to update -
      # which deletes their session, their crypto keys and their message history. Generate the key ONCE:
      #   keytool -genkeypair -v -keystore release.jks -alias release -keyalg RSA -keysize 4096 -validity 10000
      # back it up somewhere safe, then add these repository secrets (Settings > Secrets and variables > Actions):
      #   RELEASE_KEYSTORE_BASE64    output of: base64 -w0 release.jks
      #   RELEASE_KEYSTORE_PASSWORD  the -storepass you chose
      #   RELEASE_KEY_ALIAS          the -alias you chose (release)
      #   RELEASE_KEY_PASSWORD       the -keypass you chose
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Refusing to sign with a throwaway key: every"
            echo "::error::build would get a different certificate, so users could not update without"
            echo "::error::uninstalling first, which destroys their session. See the comment above this step."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks

      - name: Sign release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | sort -rV | head -1)
          find vector-app/build/outputs/apk/gplay/release -name "*.apk" | while read apk; do
            "$APKSIGNER" sign \
              --ks /tmp/release.jks \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "env:RELEASE_KEYSTORE_PASSWORD" \
              --key-pass "env:RELEASE_KEY_PASSWORD" \
              "$apk"
            echo "Signed: $apk"
          done
          # The certificate digest must be identical on every run. If it ever changes, users cannot update
          # in place any more and the key handling above has gone wrong.
          FIRST_APK=$(find vector-app/build/outputs/apk/gplay/release -name "*.apk" | head -1)
          "$APKSIGNER" verify --print-certs "$FIRST_APK" | grep -i "SHA-256 digest"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f /tmp/release.jks

      - name: Collect signed APKs
        run: |
          mkdir -p signed-apks
          find vector-app/build/outputs/apk/gplay/release -name "*.apk" -exec cp {} signed-apks/ \;

      # One artifact per APK so the run's Artifacts list shows each APK by filename.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vector-gplay-arm64-v8a-release-unsigned.apk
          path: signed-apks/vector-gplay-arm64-v8a-release-unsigned.apk
          if-no-files-found: error
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vector-gplay-armeabi-v7a-release-unsigned.apk
          path: signed-apks/vector-gplay-armeabi-v7a-release-unsigned.apk
          if-no-files-found: error
      - name: Upload universal APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vector-gplay-universal-release-unsigned.apk
          path: signed-apks/vector-gplay-universal-release-unsigned.apk
          if-no-files-found: error
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vector-gplay-x86_64-release-unsigned.apk
          path: signed-apks/vector-gplay-x86_64-release-unsigned.apk
          if-no-files-found: error
      - name: Upload x86 APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vector-gplay-x86-release-unsigned.apk
          path: signed-apks/vector-gplay-x86-release-unsigned.apk
          if-no-files-found: error

